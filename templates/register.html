<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register | AI Study Buddy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="page auth-page">
    <section class="card auth-card">
      <h1 style="margin-bottom: 0.5rem;">Register</h1>
      <p class="small" style="margin-bottom: 1rem;">
        Create a new account to use the dashboard.
      </p>

      {% if error %}
      <div class="status err" style="margin-bottom: 8px;">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('register') }}">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="Pick a username"
          required
        />

        <label for="password" style="margin-top: 8px;">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Choose a password"
          required
        />

        <label for="confirm" style="margin-top: 8px;">Confirm Password</label>
        <input
          id="confirm"
          name="confirm"
          type="password"
          placeholder="Re-type password"
          required
        />

        <button type="submit" style="width: 100%; justify-content: center; margin-top: 14px;">
          ✨ Register
        </button>
      </form>

      <div class="small" style="margin-top: 12px; text-align:center;">
        Already have an account?
        <a href="{{ url_for('login') }}">Back to login</a>
      </div>
    </section>
  </div>
</body>
</html>
